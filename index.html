<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#f5e6e9"><title>Janet 的旅行账本</title>
<style>
:root{--ink:#28312d;--blue:#80b0d8;--pale:#f5e6e9;--pink:#f1bec5;--cream:#f0f0c8;--olive:#989058;--green:#405838;--yellow:#f0c030}*{box-sizing:border-box}body{margin:0;background:#e6eef6;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;color:var(--ink)}.app{max-width:430px;min-height:100vh;margin:auto;padding:18px 18px 104px;background:#fcfaf5;position:relative;overflow:hidden}.petal{position:absolute;border-radius:99px;background:#f1bec5;opacity:.7;filter:blur(1px)}.petal:nth-child(1){width:130px;height:45px;transform:rotate(27deg);right:-35px;top:50px}.petal:nth-child(2){width:75px;height:26px;transform:rotate(-42deg);left:-25px;top:210px;background:#98c0e8}.top{display:flex;justify-content:space-between;align-items:center;position:relative}.hello{font-size:14px;color:#6d766e}.hello b{display:block;color:var(--ink);font-size:27px;letter-spacing:-1px;margin-top:3px}.avatar{width:43px;height:43px;border-radius:50%;background:var(--green);display:grid;place-items:center;color:#fff;font-weight:700;box-shadow:0 5px 14px #40583844}.hero{margin-top:25px;padding:22px;border-radius:26px;background:linear-gradient(135deg,#80b0d8,#98c0e8);box-shadow:0 12px 26px #80b0d844;position:relative;overflow:hidden}.hero:after{content:'✿  ✿';position:absolute;font-size:80px;letter-spacing:12px;right:-24px;bottom:-38px;color:#f5e6e977}.eyebrow{font-size:12px;font-weight:700;letter-spacing:1px}.hero h1{font-size:28px;line-height:1.18;margin:7px 0 18px;letter-spacing:-1px}.pill{display:inline-flex;align-items:center;gap:6px;background:#ffffffa8;border:1px solid #fff;border-radius:99px;padding:7px 10px;font-size:12px}.section{display:flex;align-items:end;justify-content:space-between;margin:27px 2px 12px}.section h2{font-size:19px;margin:0;letter-spacing:-.5px}.link{font-size:13px;color:var(--green);font-weight:650} .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#fff;border-radius:18px;padding:15px 12px;box-shadow:0 5px 18px #28312d0b}.stat small{font-size:11px;color:#737b75}.stat b{display:block;font-size:18px;margin-top:7px;letter-spacing:-.5px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.q{border:0;border-radius:18px;padding:14px 5px;background:#fff;box-shadow:0 5px 16px #28312d0b;font:600 12px inherit;color:var(--ink)}.q i{display:grid;place-items:center;margin:auto auto 7px;width:32px;height:32px;border-radius:12px;background:var(--pale);font-style:normal;font-size:17px}.q:nth-child(2) i{background:#dcecf8}.q:nth-child(3) i{background:#f8e8ad}.ticket{height:183px;padding:20px 21px;margin:0 0 14px;position:relative;overflow:hidden;background:#f1bec5;clip-path:polygon(0 5%,3% 3%,5% 5%,9% 2%,13% 5%,18% 2%,22% 5%,27% 2%,31% 5%,36% 2%,41% 5%,46% 2%,51% 5%,56% 2%,61% 5%,66% 2%,71% 5%,76% 2%,81% 5%,86% 2%,91% 5%,96% 3%,100% 6%,98% 17%,100% 28%,98% 39%,100% 50%,98% 61%,100% 73%,98% 84%,100% 95%,94% 98%,88% 95%,82% 98%,76% 95%,70% 98%,64% 95%,58% 98%,52% 95%,46% 98%,40% 95%,34% 98%,28% 95%,22% 98%,16% 95%,10% 98%,4% 95%,0 98%,2% 85%,0 73%,2% 61%,0 50%,2% 39%,0 28%,2% 16%);box-shadow:0 8px 20px #f1bec577}.ticket.blue{background:#80b0d8}.ticket:after{content:'';position:absolute;top:18px;bottom:18px;right:92px;border-left:1.5px dashed #28312d80}.ticket small{font-size:10px;letter-spacing:1.2px;font-weight:700}.ticket h3{font-size:25px;margin:9px 0 4px;letter-spacing:-1px}.ticket p{font-size:12px;margin:0}.mark{position:absolute;right:21px;bottom:27px;width:48px;height:48px;border-radius:50%;background:#a7424b;color:#fbead2;display:grid;place-items:center;font-size:22px;font-family:Georgia,serif;font-weight:bold;box-shadow:inset 0 0 0 3px #d87875,inset 0 0 0 6px #a7424b,0 4px 8px #7b202744}.stamp{position:absolute;left:20px;bottom:18px;font-size:11px;font-weight:650}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);padding:12px 25px max(18px,env(safe-area-inset-bottom));background:#fffffff2;backdrop-filter:blur(14px);display:flex;justify-content:space-between;border-top:1px solid #eee8dc}.nav button{border:0;background:transparent;color:#828981;font:11px inherit;display:grid;gap:4px;place-items:center}.nav button:first-child{color:var(--green);font-weight:700}.nav b{font-size:20px;line-height:18px}.modal{position:fixed;inset:0;background:#28312d66;display:none;align-items:end;justify-content:center;z-index:2}.modal.show{display:flex}.sheet{width:min(430px,100%);background:#fff;border-radius:26px 26px 0 0;padding:18px 22px 36px}.handle{width:38px;height:4px;border-radius:4px;background:#d8d8d2;margin:0 auto 20px}.sheet h2{font-size:21px;margin:0 0 15px}.choice{width:100%;border:0;background:#f5e6e9;padding:15px;border-radius:15px;text-align:left;font:600 15px inherit;margin-top:9px}.choice:nth-of-type(2){background:#dcecf8}.choice:nth-of-type(3){background:#f8e8ad}input{display:none}@media(min-width:700px){body{padding:30px}.app{min-height:852px;border-radius:42px;box-shadow:0 25px 60px #40583835}}
</style></head><body><main class="app"><span class="petal"></span><span class="petal"></span><header class="top"><div class="hello">旅行愉快，<b>Janet 的账本</b></div><div class="avatar">J</div></header><section class="hero"><div class="eyebrow">下一段旅程 · 02 DAYS</div><h1>巴黎的春天<br>正在靠近</h1><span class="pill">✦ 04.12 — 04.18 · 法国</span></section><div class="section"><h2>本次旅程</h2><span class="link">查看行程 →</span></div><section class="stats"><div class="stat"><small>已记录</small><b>¥ 4,816</b></div><div class="stat"><small>预算进度</small><b>48%</b></div><div class="stat"><small>旅行天数</small><b>7 天</b></div></section><div class="section"><h2>记一笔</h2><span class="link">全部分类</span></div><section class="quick"><button class="q" onclick="openSheet('美食')"><i>✿</i>美食</button><button class="q" onclick="openSheet('交通')"><i>⌁</i>交通</button><button class="q" onclick="openSheet('购物')"><i>♢</i>购物</button></section><div class="section"><h2>旅行票根</h2><span class="link">我的收藏 →</span></div><article class="ticket"><small>JANET · TRAVEL MEMORY</small><h3>巴黎 · PARIS</h3><p>2026 年 04 月 12 日 · 法国</p><span class="stamp">塞纳河边的花市</span><span class="mark">J</span></article><article class="ticket blue"><small>CITY MEMORY · 2025</small><h3>东京 · TOKYO</h3><p>2025 年 03 月 18 日 · 日本</p><span class="stamp">清晨的喫茶店</span><span class="mark">J</span></article><nav class="nav"><button><b>⌂</b>今日</button><button><b>⌁</b>旅程</button><button><b>✿</b>票根</button><button><b>◌</b>我的</button></nav></main><div class="modal" id="modal" onclick="closeSheet(event)"><section class="sheet" onclick="event.stopPropagation()"><div class="handle"></div><h2 id="modalTitle">新增账目</h2><button class="choice" onclick="addExpense('手动输入')">✎　手动输入金额</button><button class="choice" onclick="document.getElementById('proof').click()">▧　上传机票 / 酒店截图</button><button class="choice" onclick="addExpense('稍后补充')">◷　先记一笔，稍后补充</button><input id="proof" type="file" accept="image/*" onchange="proofAdded()"></section></div><script>function openSheet(x){document.getElementById('modalTitle').textContent='新增'+x+'账目';document.getElementById('modal').classList.add('show')}function closeSheet(){document.getElementById('modal').classList.remove('show')}function addExpense(x){localStorage.setItem('janetLastExpense',x);alert('已保存「'+x+'」到本机账本');closeSheet()}function proofAdded(){const f=document.getElementById('proof').files[0];if(f){localStorage.setItem('janetProof',f.name);alert('已选择凭证：'+f.name+'\n上线 OCR 后可自动识别金额和地点。');closeSheet()}}</script></body></html>
