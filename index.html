<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Janet 的旅行账本</title>
<style>
:root{--ink:#405838;--blue:#80b0d8;--pink:#f1bec5;--paper:#fffdf8;--cream:#f5e6e9;--yellow:#f0c030;--line:#e8ddd3}*{box-sizing:border-box}body{margin:0;background:#edf4f7;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.app{width:min(100%,430px);min-height:100vh;margin:auto;background:var(--paper);padding:env(safe-area-inset-top) 20px 96px}.top{display:flex;justify-content:space-between;align-items:center;padding:20px 0 12px}.brand{font-weight:800;font-size:22px;letter-spacing:-1px}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--pink);font-weight:800}.view{display:none}.view.on{display:block}.hero{border-radius:28px;background:linear-gradient(145deg,var(--blue),#b8d6ec);padding:24px;min-height:210px;position:relative;overflow:hidden}.hero:after{content:'✿  ✿  ✿';position:absolute;right:-20px;bottom:0;font-size:50px;color:#fff8;transform:rotate(-12deg)}h1{font-size:30px;letter-spacing:-1.4px;margin:0 0 10px;line-height:1.15}h2{font-size:21px;margin:22px 0 12px}.hero p{margin:0 0 20px;font-size:14px;line-height:1.6}.btn{border:0;border-radius:14px;background:var(--ink);color:#fff;padding:13px 16px;font-size:15px;font-weight:700}.btn.light{background:#fff;color:var(--ink)}.btn.yellow{background:var(--yellow);color:#5d5015}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.stat,.card{border:1px solid var(--line);border-radius:18px;background:#fff;padding:15px}.stat b{display:block;font-size:21px;margin-top:6px}.muted{color:#7e8d7b;font-size:13px}.quick{display:flex;gap:9px;overflow:auto;padding-bottom:4px}.quick button{white-space:nowrap;border:0;border-radius:14px;padding:12px;background:var(--cream);color:var(--ink);font-weight:650}.quick button:nth-child(2){background:#e9dfae}.quick button:nth-child(3){background:#d9e9ef}.empty{text-align:center;padding:42px 22px;border:1px dashed #c8bcae;border-radius:22px;background:#fff}.empty .icon{font-size:40px}.form{display:grid;gap:12px}.field label{display:block;font-size:13px;font-weight:700;margin:0 0 6px}.field input,.field select{width:100%;padding:13px;border:1px solid var(--line);background:#fff;border-radius:12px;font:inherit;color:var(--ink)}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.trip{background:var(--cream);border-radius:20px;padding:18px;margin-top:12px}.trip b{font-size:20px}.expense{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #eee}.dot{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:#dbeaf1}.expense .sum{margin-left:auto;font-weight:800}.upload{margin-top:14px;border:1.5px dashed #bbac9a;border-radius:16px;padding:17px;text-align:center;background:#fff9f8}.ticket{background:var(--pink);padding:24px 18px;border-radius:9px;clip-path:polygon(0 4%,3% 2%,6% 4%,9% 1%,13% 4%,17% 2%,21% 4%,26% 1%,31% 4%,36% 2%,40% 4%,45% 1%,50% 4%,55% 2%,60% 4%,65% 1%,70% 4%,75% 2%,80% 4%,85% 1%,90% 4%,95% 2%,100% 4%,100% 96%,96% 98%,92% 96%,87% 99%,82% 96%,77% 98%,72% 96%,67% 99%,62% 96%,57% 98%,52% 96%,47% 99%,42% 96%,37% 98%,32% 96%,27% 99%,22% 96%,17% 98%,12% 96%,7% 99%,3% 96%,0 98%);min-height:195px;position:relative}.seal{position:absolute;right:19px;bottom:20px;width:53px;height:53px;border-radius:50%;display:grid;place-items:center;background:#a85052;border:3px dashed #f9c8b7;color:#fff;font-size:18px;font-weight:800;box-shadow:0 2px 5px #0003}.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,430px);display:flex;justify-content:space-around;padding:11px 15px calc(11px + env(safe-area-inset-bottom));background:#fffffff2;border-top:1px solid #eee}.tabbar button{border:0;background:none;color:#879381;font-size:11px;display:grid;gap:4px;place-items:center}.tabbar button.active{color:var(--ink);font-weight:800}.tabbar i{font-style:normal;font-size:19px}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#405838;color:#fff;padding:11px 15px;border-radius:99px;font-size:13px;opacity:0;transition:.2s;white-space:nowrap}.toast.show{opacity:1}@media(min-width:700px){body{padding:28px}.app{border-radius:32px;min-height:850px;box-shadow:0 20px 70px #40583822}}
</style></head><body><main class="app"><header class="top"><div class="brand">旅行账本 <span>✦</span></div><div class="avatar">J</div></header>
<section id="home" class="view on"><div id="homeBlank" class="hero"><h1>从一段旅程<br>开始记录。</h1><p>没有预设城市，没有虚构开销。<br>这本账，只属于 Janet。</p><button class="btn light" onclick="openView('journey')">新建我的第一趟旅程</button></div><div id="homeData" hidden><div class="hero"><span class="muted">当前旅程</span><h1 id="homeTitle">—</h1><p id="homeDates"></p><button class="btn light" onclick="openView('expense')">记录一笔花销</button></div><div class="stats"><div class="stat"><span class="muted">本次已记录</span><b id="total">¥0</b></div><div class="stat"><span class="muted">消费笔数</span><b id="count">0 笔</b></div></div></div><h2>快捷记录</h2><div class="quick"><button onclick="openExpense('美食')">🍜 美食</button><button onclick="openExpense('购物')">🛍 购物</button><button onclick="openExpense('交通')">🚇 交通</button><button onclick="openExpense('机票')">✈️ 机票</button></div></section>
<section id="journey" class="view"><h1>新建旅程</h1><p class="muted">先填写行程，所有花销都会归入这趟旅行。</p><form class="form" onsubmit="saveTrip(event)"><div class="field"><label>国家 / 地区</label><input id="country" required placeholder="例如：意大利"></div><div class="field"><label>第一站城市</label><input id="city" required placeholder="例如：罗马"></div><div class="row"><div class="field"><label>开始日期</label><input id="start" type="date" required></div><div class="field"><label>结束日期</label><input id="end" type="date" required></div></div><div class="field"><label>和谁一起去</label><input id="companion" placeholder="例如：自己 / 妈妈 / 好朋友"></div><div class="field"><label>旅行主币种</label><select id="currency"><option value="CNY">人民币 CNY</option><option value="EUR">欧元 EUR</option><option value="JPY">日元 JPY</option><option value="USD">美元 USD</option></select></div><button class="btn" type="submit">保存旅程，开始记账</button></form><div id="tripCard"></div></section>
<section id="expense" class="view"><h1>记录花销</h1><div id="expenseBlank" class="empty"><div class="icon">🧳</div><h2>先创建一段旅程</h2><p class="muted">费用必须归属到一次旅行。</p><button class="btn" onclick="openView('journey')">新建旅程</button></div><div id="expenseForm" hidden><div class="card" id="expenseTrip"></div><form class="form" onsubmit="saveExpense(event)"><div class="field"><label>类别</label><select id="kind"><option>美食</option><option>购物</option><option>交通</option><option>机票</option><option>酒店</option><option>门票</option><option>其他</option></select></div><div class="row"><div class="field"><label>金额</label><input id="amount" type="number" min="0" step="0.01" required placeholder="0.00"></div><div class="field"><label>消费城市</label><input id="expenseCity" required placeholder="填写城市"></div></div><div class="field"><label>备注</label><input id="note" placeholder="例如：机场到酒店"></div><button class="btn" type="submit">保存这笔花销</button></form><label class="upload">📎 上传机票 / 酒店 / 小票截图<input type="file" accept="image/*" hidden onchange="proof(this)"></label><h2>本次记录</h2><div id="expenseList"></div></div></section>
<section id="tickets" class="view"><h1>旅行票根</h1><div id="ticketBlank" class="empty"><div class="icon">🎟</div><h2>旅程结束后生成票根</h2><p class="muted">先新建旅程，票根会使用你的城市与日期。</p></div><div id="ticketReady" hidden><p class="muted">由你的旅程信息生成 · 不使用预设城市</p><div class="ticket"><span class="muted">JANET · TRAVEL MEMORY</span><h1 id="ticketCity">—</h1><p id="ticketMeta"></p><p id="ticketCountry"></p><div class="seal">J</div></div><button class="btn yellow" style="margin-top:16px" onclick="makeTicket()">生成我的旅行票根</button></div></section>
<section id="profile" class="view"><h1>我的账本</h1><div class="card"><b>Janet</b><p class="muted">数据仅保存在当前浏览器。</p></div><button class="btn" style="margin-top:16px" onclick="resetAll()">清除本机测试数据</button></section>
</main><nav class="tabbar"><button class="active" data-v="home" onclick="openView('home')"><i>⌂</i>首页</button><button data-v="journey" onclick="openView('journey')"><i>✦</i>旅程</button><button data-v="expense" onclick="openView('expense')"><i>＋</i>记账</button><button data-v="tickets" onclick="openView('tickets')"><i>⌑</i>票根</button><button data-v="profile" onclick="openView('profile')"><i>◯</i>我的</button></nav><div class="toast" id="toast"></div>
<script>
const KEY='janet-travel-ledger-v2';let state=JSON.parse(localStorage.getItem(KEY)||'{"trip":null,"expenses":[]}');const $=id=>document.getElementById(id);function persist(){localStorage.setItem(KEY,JSON.stringify(state))}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}function openView(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));$(v).classList.add('on');document.querySelectorAll('.tabbar button').forEach(x=>x.classList.toggle('active',x.dataset.v===v));render()}function saveTrip(e){e.preventDefault();state.trip={country:$('country').value.trim(),city:$('city').value.trim(),start:$('start').value,end:$('end').value,companion:$('companion').value.trim()||'自己',currency:$('currency').value};persist();toast('旅程已创建，现在可以记录花销');openView('home')}function openExpense(k){if(!state.trip){toast('请先新建旅程');openView('journey');return}openView('expense');$('kind').value=k}function saveExpense(e){e.preventDefault();if(!state.trip)return;state.expenses.unshift({kind:$('kind').value,amount:+$('amount').value,city:$('expenseCity').value.trim(),note:$('note').value.trim()});persist();e.target.reset();toast('已保存这笔花销');render()}function proof(i){if(i.files[0])toast('已选择：'+i.files[0].name+'（OCR 识别待接入）')}function makeTicket(){if(!state.trip)return;toast('票根已生成，Janet 的旅行印记已收好')}function resetAll(){localStorage.removeItem(KEY);state={trip:null,expenses:[]};toast('已清除');openView('home')}function render(){let t=state.trip,ex=state.expenses;$('homeBlank').hidden=!!t;$('homeData').hidden=!t;$('expenseBlank').hidden=!!t;$('expenseForm').hidden=!t;$('ticketBlank').hidden=!!t;$('ticketReady').hidden=!t;if(!t){$('tripCard').innerHTML='';return}$('homeTitle').textContent=t.city+' · '+t.country;$('homeDates').textContent=`${t.start} → ${t.end} · 与 ${t.companion}`;$('tripCard').innerHTML=`<div class="trip"><span class="muted">已创建的旅程</span><br><b>${t.country} · ${t.city}</b><p class="muted">${t.start} → ${t.end} · ${t.companion} · ${t.currency}</p></div>`;$('expenseTrip').innerHTML=`<b>${t.city} · ${t.country}</b><br><span class="muted">当前旅程 · ${t.currency}</span>`;$('expenseCity').value=$('expenseCity').value||t.city;let total=ex.reduce((a,x)=>a+x.amount,0);$('total').textContent='¥'+total.toFixed(2);$('count').textContent=ex.length+' 笔';$('expenseList').innerHTML=ex.length?ex.map(x=>`<div class="expense"><div class="dot">${({美食:'🍜',购物:'🛍',交通:'🚇',机票:'✈️',酒店:'🏨',门票:'🎫'})[x.kind]||'○'}</div><div><b>${x.kind} · ${x.city}</b><br><span class="muted">${x.note||'未添加备注'}</span></div><div class="sum">${x.amount.toFixed(2)}</div></div>`).join(''):'<p class="muted">还没有记录，先添加第一笔吧。</p>';$('ticketCity').textContent=t.city;$('ticketMeta').textContent=`${t.start} — ${t.end}`;$('ticketCountry').textContent=t.country+' · Janet 的旅行印记'}render();
</script></body></html>
